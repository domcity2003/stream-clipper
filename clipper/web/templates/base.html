<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Clipper</title>
<style>
  :root {
    --bg: #0d0e11; --panel: #16181d; --line: #262a31; --text: #eef0f3; --muted: #8b919c;
    --accent: #ffe234; --good: #3ddc84; --bad: #ff5c5c; --radius: 14px;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 15px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, sans-serif; }
  header { position: sticky; top: 0; z-index: 5; background: rgba(13,14,17,.92); backdrop-filter: blur(10px);
           border-bottom: 1px solid var(--line); padding: 10px 16px env(safe-area-inset-top); }
  .brand { font-weight: 800; letter-spacing: -.02em; font-size: 17px; }
  .brand span { color: var(--accent); }
  nav { display: flex; gap: 6px; margin-top: 8px; overflow-x: auto; }
  nav a { color: var(--muted); text-decoration: none; padding: 6px 12px; border-radius: 999px; white-space: nowrap;
          border: 1px solid var(--line); font-size: 14px; }
  nav a.on { color: #000; background: var(--accent); border-color: var(--accent); font-weight: 600; }
  nav .n { opacity: .7; margin-left: 3px; }
  main { max-width: 760px; margin: 0 auto; padding: 16px; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px; margin-bottom: 16px; }
  .muted { color: var(--muted); font-size: 13px; }
  .row { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
  .pill { display: inline-block; padding: 2px 9px; border-radius: 999px; font-size: 12px; border: 1px solid var(--line); color: var(--muted); }
  .score { font-weight: 800; color: #000; background: var(--accent); border: 0; }
  label { display: block; font-size: 12px; color: var(--muted); margin: 12px 0 4px; text-transform: uppercase; letter-spacing: .04em; }
  input[type=text], input[type=url], textarea, select {
    width: 100%; background: var(--bg); color: var(--text); border: 1px solid var(--line); border-radius: 10px;
    padding: 10px 12px; font: inherit; }
  textarea { min-height: 70px; resize: vertical; }
  button, .btn { border: 0; border-radius: 12px; padding: 12px 16px; font: inherit; font-weight: 700; cursor: pointer; }
  .approve { background: var(--good); color: #04210f; flex: 2; }
  .reject { background: transparent; color: var(--bad); border: 1px solid var(--bad); flex: 1; }
  .primary { background: var(--accent); color: #000; }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  td, th { text-align: left; padding: 8px 6px; border-bottom: 1px solid var(--line); }
  th { color: var(--muted); font-weight: 500; font-size: 12px; text-transform: uppercase; }
  .num { text-align: right; font-variant-numeric: tabular-nums; }
  .empty { text-align: center; padding: 40px 16px; color: var(--muted); }
  a { color: var(--accent); }
</style>
</head>
<body>
<header>
  <div class="brand">Stream<span>Clipper</span></div>
  <nav>
    <a href="/" class="{{ 'on' if tab=='review' }}">Review<span class="n">{{ counts.get('review', 0) }}</span></a>
    <a href="/scheduled" class="{{ 'on' if tab=='scheduled' }}">Posts<span class="n">{{ counts.get('scheduled', 0) }}</span></a>
    <a href="/add" class="{{ 'on' if tab=='add' }}">Add video</a>
    <a href="/stats" class="{{ 'on' if tab=='stats' }}">Stats</a>
  </nav>
</header>
<main>{% block body %}{% endblock %}</main>
</body>
</html>
